# Portainer Docker Swarm. Label exactly one data node before deployment.
version: "3.8"
services:
  wppconnect-go:
    image: wppconnect/wppconnect-server-go:${WPP_SERVER_GO_TAG:-0.1.3}
    stop_grace_period: 35s
    environment:
      PORT: "21465"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in Portainer}"
      WEBHOOK_URL: "${WEBHOOK_URL:-}"
      DATA_DIR: "/data"
      AUTO_RESTORE_SESSIONS: "${AUTO_RESTORE_SESSIONS:-true}"
      SHUTDOWN_TIMEOUT: "${SHUTDOWN_TIMEOUT:-25s}"
      WEBHOOK_WORKERS: "${WEBHOOK_WORKERS:-2}"
      WEBHOOK_QUEUE_SIZE: "${WEBHOOK_QUEUE_SIZE:-256}"
      WEBHOOK_ATTEMPTS: "${WEBHOOK_ATTEMPTS:-4}"
      WEBHOOK_TIMEOUT: "${WEBHOOK_TIMEOUT:-10s}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-}"
      ENABLE_MANAGER: "${ENABLE_MANAGER:-true}"
      HISTORY_RETENTION_DAYS: "${HISTORY_RETENTION_DAYS:-30}"
      HISTORY_MAX_MESSAGES: "${HISTORY_MAX_MESSAGES:-100000}"
      HISTORY_MAX_BYTES: "${HISTORY_MAX_BYTES:-268435456}"
      OUTBOX_RETENTION_DAYS: "${OUTBOX_RETENTION_DAYS:-7}"
      OUTBOX_MAX_EVENTS: "${OUTBOX_MAX_EVENTS:-100000}"
      OUTBOX_MAX_BYTES: "${OUTBOX_MAX_BYTES:-134217728}"
      NATS_URL: "${NATS_URL:-}"
      AMQP_URL: "${AMQP_URL:-}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY_ID:-}"
      S3_SECRET_ACCESS_KEY: "${S3_SECRET_ACCESS_KEY:-}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-}"
      S3_USE_SSL: "${S3_USE_SSL:-true}"
      MEDIA_RETENTION_DAYS: "${MEDIA_RETENTION_DAYS:-7}"
      ENABLE_EXPERIMENTAL_INTERACTIVES: "${ENABLE_EXPERIMENTAL_INTERACTIVES:-false}"
    ports:
      - target: 21465
        published: ${WPP_SERVER_GO_PORT:-21465}
        protocol: tcp
        mode: ingress
    volumes:
      - wpp_go_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:21465/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.wppconnect_go_data == true
      restart_policy:
        condition: any
        delay: 5s
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first

volumes:
  wpp_go_data: {}
