name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Regenerate independent Node bcrypt fixtures
        run: |
          npm install --prefix "$RUNNER_TEMP/node-fixtures" --ignore-scripts=false --no-audit --no-fund bcrypt@6.0.0
          BCRYPT_MODULE="$RUNNER_TEMP/node-fixtures/node_modules/bcrypt" node scripts/generate-auth-fixtures.cjs
          git diff --exit-code -- internal/auth/testdata/node-bcrypt.json
      - run: go test -race ./...
      - run: go vet ./...
      - name: Validate deployment manifests
        env:
          SECRET_KEY: ci-only-secret
        run: |
          docker compose config --quiet
          docker compose -f deploy/portainer-stack.yml config --quiet
          docker stack config -c deploy/portainer-swarm.yml >/dev/null
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/${{ matrix.arch }}
          tags: wppconnect-go:smoke
          cache-from: type=gha,scope=smoke-${{ matrix.arch }}
          cache-to: type=gha,scope=smoke-${{ matrix.arch }},mode=max
      - name: Test startup, healthcheck, shutdown and restart
        run: go run ./cmd/smoke-image -image wppconnect-go:smoke -platform linux/${{ matrix.arch }}
