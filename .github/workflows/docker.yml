name: Docker

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        description: 'Semantic version tag to publish'
        required: false
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: write

env:
  IMAGE_NAME: wppconnect/wppconnect-server-go
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }},enable=${{ startsWith(env.RELEASE_TAG, 'v') }}
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }},enable=${{ startsWith(env.RELEASE_TAG, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }},enable=${{ startsWith(env.RELEASE_TAG, 'v') && !contains(env.RELEASE_TAG, '-') }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }},enable=${{ startsWith(env.RELEASE_TAG, 'v') && !contains(env.RELEASE_TAG, '-') }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(env.RELEASE_TAG, 'v') && !contains(env.RELEASE_TAG, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        if: startsWith(env.RELEASE_TAG, 'v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists"
            exit 0
          fi

          version="${RELEASE_TAG#v}"
          stable_version="${version%%-*}"
          IFS='.' read -r major minor patch <<< "$stable_version"
          short_sha="${GITHUB_SHA::7}"

          if [[ "$version" == *-* ]]; then
            release_type=(--prerelease)
            notes=$(cat <<EOF
          ## Docker images

          - \`${IMAGE_NAME}:${RELEASE_TAG}\`
          - \`${IMAGE_NAME}:${version}\`
          - \`${IMAGE_NAME}:sha-${short_sha}\`
          EOF
            )
          else
            release_type=()
            notes=$(cat <<EOF
          ## Docker images

          - \`${IMAGE_NAME}:${RELEASE_TAG}\`
          - \`${IMAGE_NAME}:${version}\`
          - \`${IMAGE_NAME}:${major}.${minor}\`
          - \`${IMAGE_NAME}:${major}\`
          - \`${IMAGE_NAME}:latest\`
          - \`${IMAGE_NAME}:sha-${short_sha}\`
          EOF
            )
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            "${release_type[@]}" \
            --notes "$notes"
